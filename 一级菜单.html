<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>湖南文理学院一级导航菜单</title>
    <style>
        *{
            margin:0;
            padding:0;
            list-style:none;
        }
        .nav{
            background:#0055cc;
            display:flex;
            align-items:center;
        }
        .nav .title{
            color:#fff;
            font-size:20px;
            font-weight:bold;
            padding:16px 20px;
            white-space:nowrap;
        }
        .nav>ul{
            display:flex;
        }
        .nav>ul>li>a{
            display:block;
            padding:16px 22px;
            color:#fff;
            text-decoration:none;
            font-size:17px;
        }
        .nav>ul>li>a:hover{
            background:#003399;
        }
    </style>
</head>
<body>
    <div class="nav">
        <div class="title">欢迎访问湖南文理学院</div>
        <ul>
            <li><a href="#">教学院（部）</a></li>
            <li><a href="#">党群机构</a></li>
            <li><a href="#">行政教辅机构</a></li>
            <li><a href="#">信息系统</a></li>
            <li><a href="#">国际交流</a></li>
            <li><a href="#">数字图书馆</a></li>
            <li><a href="#">采购信息</a></li>
            <li><a href="#">办事大厅</a></li>
        </ul>
    </div>
</body>
</html>
